[project]
name = "sentinel-bench"
version = "0.1.0"
description = "SENTINEL: an offline simulator and starter toolkit for adaptive safety of autonomous tool-using AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "SENTINEL maintainers (IndabaX Tunisia)" }]
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0.2",
  "rich>=13.7",
]

[project.optional-dependencies]
hf = ["transformers>=4.44", "torch>=2.3"]

[project.scripts]
sentinel = "sentinel.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts", "starter-kits"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]
ignore = [
  "S101",   # asserts are fine in tests and invariants
  "S311",   # random is used for seeded, non-cryptographic simulation only
  "B008",   # typer/fastapi use call defaults by design
  "RUF012",
  "PT018",  # compound assertions keep scenario checks readable
]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_scoring.py" = ["C408"]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]
"src/sentinel/sandbox/docker.py" = ["S603", "S607"]
"src/sentinel/sandbox/runner.py" = ["S603", "S607"]
"src/sentinel/sandbox/submission.py" = ["S603"]
"starter-kits/**/tests/**" = ["S101"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sentinel"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
  "security: security-focused regression tests",
  "integration: end-to-end offline tests",
]

[tool.coverage.run]
source = ["sentinel"]
branch = true
